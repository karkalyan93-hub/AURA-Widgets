
name: Inspect AURA Project

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          mkdir source
          unzip -q aura-widgets.zip -d source

      - name: Inspect Android project structure
        run: |
          echo "===== PROJECT FILES ====="
          find source -type f \( \
            -name "settings.gradle" -o \
            -name "settings.gradle.kts" -o \
            -name "build.gradle" -o \
            -name "build.gradle.kts" -o \
            -name "gradlew" -o \
            -name "AndroidManifest.xml" \
          \) -print
          echo "===== DIRECTORY STRUCTURE ====="
          find source -maxdepth 4 -type d -print
