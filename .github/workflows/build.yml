name: Check AURA Gradle Configuration

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip -q aura-widgets.zip -d source

      - name: Read Gradle configuration
        run: |
          echo "===== SETTINGS ====="
          cat source/settings.gradle.kts
          echo "===== ROOT BUILD ====="
          cat source/build.gradle.kts
          echo "===== APP BUILD ====="
          cat source/app/build.gradle.kts
          echo "===== WRAPPER FILES ====="
          find source/gradle/wrapper -type f -maxdepth 2 -print
          echo "===== WRAPPER PROPERTIES ====="
          if [ -f source/gradle/wrapper/gradle-wrapper.properties ]; then
            cat source/gradle/wrapper/gradle-wrapper.properties
          fi
